<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CPU Scheduling Visualization</title>
    <link rel="stylesheet" href="sytles.css" />
  </head>
  <body>
    <body>
    <header>
      <h1>CPU Scheduler Visualizer</h1>
      <p>Round Robin &nbsp;·&nbsp; SRTF</p>
    </header>
      <div class="panel inputs">
        <h3 >INPUTS</h3>
        <div style="margin-bottom: 5px ">
        </div>
        <button class="btn inp"  onclick="S1data()">
          ▶ I1
        </button>
        <button  class="btn inp"  onclick="S2data()">
          ▶ I2
        </button>
        <button  class="btn inp"  onclick="S3data()">
          ▶ I3
        </button>
        <button  class="btn inp"  onclick="defaultdata()">
          ▶ Defaults
        </button>
        <button class="btn rb" style="background-color: green"  onclick="uiRunBoth()">
            ▶ I1
          </button>
      </div>
    <div class="grid">
      <!-- Round Robin Section -->
      <div class="panel panel-rr">
        <h3>Round Robin</h3>
        <div style="margin: 10px 0">
          Quantum: <input type="number" id="rr-q" value="4" />
        </div>
        <div class="inplst" id="rr-input-list"></div>
        <button class="btn" onclick="addNewProcess('rr')">+ Add</button>
        <button class="btn" style="color: var(--rr)" onclick="uiRunRR()">
          ▶ Run RR
        </button>
        <div id="rr-result-area"></div>
      </div>

      <!-- SRTF Section -->
      <div class="panel panel-srtf">
        <h3>SRTF</h3>

        <div class="inplst" id="srtf-input-list"></div>
        <button class="btn" onclick="addNewProcess('srtf')">+ Add</button>
        <button class="btn" style="color: var(--srtf)" onclick="uiRunSRTF()">
          ▶ Run SRTF
        </button>
        <div id="srtf-result-area"></div>
      </div>
    </div>
    <script src="new.js"></script>
  </body>
</html>
